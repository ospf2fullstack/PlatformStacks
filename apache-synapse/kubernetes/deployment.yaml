apiVersion: v1
kind: Namespace
metadata:
  name: integration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse-config
  namespace: integration
data:
  synapse.properties: |
    synapse.xpath.classpath=conf/xpath.classpath
    synapse.xml.xpath.classpath=conf/xpath.classpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      containers:
      - name: synapse
        image: synapse:latest
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: JAVA_OPTS
          value: "-Xms512m -Xmx1024m"
        volumeMounts:
        - name: config
          mountPath: /opt/synapse/config
        - name: data
          mountPath: /opt/synapse/repository
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: synapse-config
      - name: data
        persistentVolumeClaim:
          claimName: synapse-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-pvc
  namespace: integration
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: integration
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 443
    targetPort: 8443
    protocol: TCP
    name: https
  selector:
    app: synapse
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synapse-ingress
  namespace: integration
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: synapse.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: synapse
            port:
              number: 80