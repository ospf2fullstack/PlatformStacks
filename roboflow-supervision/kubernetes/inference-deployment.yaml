apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervision-inference
  labels:
    app: supervision-inference
    platform: roboflow-supervision
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supervision-inference
  template:
    metadata:
      labels:
        app: supervision-inference
    spec:
      containers:
        - name: inference
          image: sv-inference:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
              nvidia.com/gpu: "1"
          env:
            - name: MODEL_NAME
              value: "yolov8n"
            - name: CONFIDENCE_THRESHOLD
              value: "0.3"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: supervision-inference-svc
  labels:
    app: supervision-inference
spec:
  selector:
    app: supervision-inference
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
