# LiteLLM Monolithic Helm Values
# Chart: oci://ghcr.io/berriai/litellm-helm
# Version: 1.93.0

replicaCount: 2

image:
  repository: docker.litellm.ai/berriai/litellm
  tag: "main-v1.93.0"
  pullPolicy: IfNotPresent

proxy:
  masterKeySecretName: litellm-master-key
  masterKeySecretKey: master-key
  secretName: litellm-secrets
  port: 4000
  config: |
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      - model_name: claude-sonnet-5
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: gemini-3.5-flash
        litellm_params:
          model: vertex_ai/gemini-3.5-flash
      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY

    litellm_settings:
      drop_params: true
      set_verbose: false
      num_retries: 2
      request_timeout: 60
      cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        port: os.environ/REDIS_PORT
        password: os.environ/REDIS_PASSWORD
        namespace: litellm_cache
        ttl: 3600

    router_settings:
      redis_host: os.environ/REDIS_HOST
      redis_port: os.environ/REDIS_PORT
      redis_password: os.environ/REDIS_PASSWORD
      routing_strategy: least-busy
      num_retries: 2
      timeout: 60
      allowed_fails: 3

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      alerting:
        - slack
      alerting_threshold: 300

db:
  useExisting: true
  deployStandalone: false

env:
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: database-url
  - name: REDIS_HOST
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: redis-host
  - name: REDIS_PORT
    value: "6379"
  - name: REDIS_PASSWORD
    valueFrom:
      secretKeyRef:
        name: litellm-secrets
        key: redis-password

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "2Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: llm.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: litellm-tls
      hosts:
        - llm.example.com

livenessProbe:
  httpGet:
    path: /health/liveliness
    port: 4000
  initialDelaySeconds: 120
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/readiness
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

migrationJob:
  enabled: true
  hooks:
    preInstall: true
    preUpgrade: true
