---
apiVersion: v1
kind: Namespace
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      - model_name: claude-sonnet-5
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: gpt-4o-mini
        litellm_params:
          model: openai/gpt-4o-mini
          api_key: os.environ/OPENAI_API_KEY

    litellm_settings:
      drop_params: true
      num_retries: 2
      request_timeout: 60

    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      timeout: 60

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: litellm-secrets
  namespace: litellm
  annotations:
    description: "Replace placeholder values with actual credentials"
data:
  # Base64-encoded values — replace before applying
  OPENAI_API_KEY: REPLACE_WITH_BASE64_ENCODED_KEY
  ANTHROPIC_API_KEY: REPLACE_WITH_BASE64_ENCODED_KEY
  LITELLM_MASTER_KEY: REPLACE_WITH_BASE64_ENCODED_KEY
  database-url: REPLACE_WITH_BASE64_ENCODED_URL
  redis-host: REPLACE_WITH_BASE64_ENCODED_HOST
  redis-password: REPLACE_WITH_BASE64_ENCODED_PASSWORD
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: litellm
  labels:
    app: litellm
    component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
      component: proxy
  template:
    metadata:
      labels:
        app: litellm
        component: proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - litellm
                topologyKey: kubernetes.io/hostname
      containers:
        - name: litellm
          image: docker.litellm.ai/berriai/litellm:main-v1.93.0
          args:
            - "--config"
            - "/app/proxy_server_config.yaml"
            - "--port"
            - "4000"
          ports:
            - containerPort: 4000
              name: http
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/proxy_server_config.yaml
              subPath: config.yaml
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-service
  namespace: litellm
  labels:
    app: litellm
spec:
  selector:
    app: litellm
    component: proxy
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm-pdb
  namespace: litellm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: litellm
      component: proxy
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: litellm-hpa
  namespace: litellm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: litellm-proxy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
