# KServe Helm Values - Standard Mode (GenAI/LLM Focused)
# Use with: helm install kserve oci://ghcr.io/kserve/charts/kserve-resources -f values.yaml

kserve:
  controller:
    # Standard mode is recommended for GenAI/LLM workloads
    deploymentMode: Standard
    
    # Gateway API configuration
    gateway:
      ingressGateway:
        enableGatewayApi: true
        kserveGateway: kserve/kserve-ingress-gateway
    
    # Resource limits for the controller
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Webhook configuration
  webhook:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# InferenceService defaults
inferenceServiceConfig:
  # Default deployment mode
  deploy:
    defaultDeploymentMode: Standard
  
  # Ingress configuration
  ingress:
    ingressGateway: kserve/kserve-ingress-gateway
    ingressService: envoy-gateway
    ingressClassName: envoy
    urlScheme: http
  
  # Logger configuration (optional)
  logger:
    image: kserve/agent:v0.19.0
    memoryRequest: 100Mi
    memoryLimit: 1Gi
    cpuRequest: 100m
    cpuLimit: "1"
