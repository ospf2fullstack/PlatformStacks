# Apache Kafka Helm Values
# Production-ready defaults for Strimzi-managed Kafka on Kubernetes

strimzi:
  enabled: true

namespace: kafka

kafka:
  version: "3.9.0"
  replicas: 3
  
  listeners:
    plain:
      port: 9092
      type: internal
      tls: false
    tls:
      port: 9093
      type: internal
      tls: true
      authentication:
        type: tls
    external:
      port: 9094
      type: loadbalancer
      tls: true
      authentication:
        type: tls

  config:
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    default.replication.factor: 3
    min.insync.replicas: 2
    num.partitions: 6
    log.retention.hours: 168
    log.retention.bytes: "10737418240"  # 10 GB per partition
    log.segment.bytes: "1073741824"    # 1 GB segments
    auto.create.topics.enable: false
    compression.type: lz4
    num.network.threads: 8
    num.io.threads: 16
    socket.send.buffer.bytes: "102400"
    socket.receive.buffer.bytes: "102400"
    socket.request.max.bytes: "104857600"

  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 500Gi
        class: fast-ssd
        deleteClaim: false

  resources:
    requests:
      memory: 8Gi
      cpu: "2"
    limits:
      memory: 12Gi
      cpu: "4"

  jvmOptions:
    xms: 4096m
    xmx: 4096m
    gcLoggingEnabled: false

  rack:
    topologyKey: topology.kubernetes.io/zone

  metricsEnabled: true

controllers:
  replicas: 3
  storage:
    type: persistent-claim
    size: 50Gi
    class: fast-ssd
    deleteClaim: false
  resources:
    requests:
      memory: 2Gi
      cpu: "500m"
    limits:
      memory: 4Gi
      cpu: "1"

entityOperator:
  topicOperator:
    enabled: true
  userOperator:
    enabled: true

cruiseControl:
  enabled: true

monitoring:
  prometheus:
    enabled: true
  grafana:
    enabled: true
    dashboards: true

security:
  tls:
    enabled: true
    # Auto-generated certificates via Strimzi
  networkPolicy:
    enabled: true
    allowedNamespaces:
      - kafka
      - monitoring

topics:
  - name: events
    partitions: 12
    replicas: 3
    config:
      retention.ms: "604800000"     # 7 days
      cleanup.policy: delete
      compression.type: lz4
      min.insync.replicas: "2"
  
  - name: commands
    partitions: 6
    replicas: 3
    config:
      retention.ms: "259200000"     # 3 days
      cleanup.policy: delete
      compression.type: lz4
      min.insync.replicas: "2"

  - name: dead-letter
    partitions: 3
    replicas: 3
    config:
      retention.ms: "2592000000"    # 30 days
      cleanup.policy: delete
      min.insync.replicas: "2"
